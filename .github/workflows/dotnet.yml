# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

# ---------------------------------------
# CI Pipeline - GitHub Actions (ci.yml)
# ---------------------------------------

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run Unit, Snapshot, Contract, Integration, Acceptance Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Install Tools
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Run Tests with Coverage
      run: |
        dotnet test --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Generate Coverage and HTML Report
      run: |
        reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:Badges;Html

    - name: Upload Report Artifact
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coveragereport

    - name: Deploy Coverage Badge to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./coveragereport
